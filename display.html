<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<title>Wash Hub · Schermo cassa</title>
<!--
  Schermo cassa (tablet al bancone, Fully Kiosk) — 07/10/2026
  A riposo: video Wash Hub a ciclo + logo. Quando la dashboard incassa un pagamento scrive
  cassaDisplay/{sede}: qui compare "Grazie {nome}" + QR della card fedeltà legato al telefono
  (card.washhub.it/?c=...). Se il cliente ha già la card mostra i punti. Torna ai video dopo 60 s.
  Login una volta con display@washhub.it (sessione persistente). ?sede=paesi-etnei per l'altra sede.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --y:#F5C518; --k:#0F0F0F; --gold:#C8A84E; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--k); color:#fff; font-family:Inter,system-ui,sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; cursor:none; }
  #riposo, #grazie, #login { position:fixed; inset:0; }
  #riposo video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #riposo .velo { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55)); }
  #riposo .marchio { position:absolute; left:0; right:0; bottom:7vh; display:flex; flex-direction:column; align-items:center; gap:1.5vh; text-align:center; }
  #riposo .marchio img { width:min(42vw,420px); filter:drop-shadow(0 6px 24px rgba(0,0,0,.6)); }
  #riposo .claim { font:600 clamp(16px,2.6vw,30px) 'Bricolage Grotesque',system-ui; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  #riposo .card-hint { font:600 clamp(12px,1.8vw,20px) Inter; color:var(--y); }

  #grazie { display:none; background:radial-gradient(circle at 50% 30%, #2a2410 0%, var(--k) 70%); align-items:center; justify-content:center; padding:4vh 4vw; }
  #grazie.on { display:flex; animation:entra .5s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes entra { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:none; } }
  .box { display:grid; grid-template-columns:1fr auto; gap:5vw; align-items:center; max-width:1200px; width:100%; }
  @media (orientation:portrait) { .box { grid-template-columns:1fr; text-align:center; justify-items:center; gap:4vh; } }
  .ciao { font:800 clamp(34px,6.5vw,84px)/1 'Bricolage Grotesque',system-ui; letter-spacing:-.02em; }
  .ciao span { color:var(--y); }
  .sotto { font:400 clamp(16px,2.4vw,28px)/1.35 Inter; color:rgba(255,255,255,.82); margin-top:2.2vh; max-width:28ch; }
  .punti { display:inline-flex; align-items:baseline; gap:.4em; margin-top:2.6vh; padding:.5em .9em; border-radius:999px; background:rgba(200,168,78,.16); border:1px solid rgba(200,168,78,.5); color:var(--gold); font:700 clamp(16px,2.4vw,28px) Inter; }
  .qrbox { background:#fff; border-radius:28px; padding:clamp(14px,2vw,26px); box-shadow:0 0 0 6px var(--y), 0 20px 60px rgba(0,0,0,.6); text-align:center; }
  .qrbox canvas, .qrbox img { display:block; width:min(36vw,46vh,380px); height:auto; image-rendering:pixelated; }
  .qrbox .lbl { color:var(--k); font:700 clamp(13px,1.7vw,19px) Inter; margin-top:10px; }
  .barra { position:fixed; left:0; bottom:0; height:6px; background:var(--y); width:100%; transform-origin:left; }

  #login { display:none; align-items:center; justify-content:center; background:var(--k); cursor:auto; }
  #login form { width:min(90vw,360px); display:flex; flex-direction:column; gap:12px; }
  #login input, #login button { font:500 16px Inter; padding:14px; border-radius:12px; border:1px solid #333; background:#1a1a1a; color:#fff; }
  #login button { background:var(--y); color:var(--k); font-weight:700; border:0; }
  #login .err { color:#ff8a8a; font-size:13px; min-height:18px; }
  #stato { position:fixed; top:8px; right:10px; width:10px; height:10px; border-radius:50%; background:#444; opacity:.6; }
</style>
</head>
<body>
<div id="riposo">
  <video id="vid" src="img/display/loop.mp4" autoplay muted loop playsinline></video>
  <div class="velo"></div>
  <div class="marchio">
    <img src="img/display/logo.png" alt="Wash Hub">
    <div class="claim">Il tuo pit-stop sul lungomare di Catania</div>
    <div class="card-hint">💎 Chiedi la tua card fedeltà: i punti partono dal primo lavaggio</div>
  </div>
</div>

<div id="grazie">
  <div class="box">
    <div>
      <div class="ciao">Grazie <span id="gNome"></span>!</div>
      <div class="sotto" id="gSotto"></div>
      <div class="punti" id="gPunti" style="display:none"></div>
    </div>
    <div class="qrbox" id="gQr"><div id="qr"></div><div class="lbl" id="gQrLbl">Inquadra con la fotocamera</div></div>
  </div>
  <div class="barra" id="barra"></div>
</div>

<div id="login">
  <form id="fLogin">
    <img src="img/display/logo.png" alt="" style="width:180px;margin:0 auto 10px">
    <input id="lEmail" type="email" placeholder="Email schermo" autocomplete="username" value="display@washhub.it">
    <input id="lPwd" type="password" placeholder="Password" autocomplete="current-password">
    <button>Collega schermo</button>
    <div class="err" id="lErr"></div>
  </form>
</div>
<div id="stato" title="collegamento"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
import { getFirestore, doc, onSnapshot, getDoc } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

const app = initializeApp({ apiKey: 'AIzaSyCj0IlKMARo0IxnqaHoN-rSd0HINuwf6Po', authDomain: 'dashboard-washhub.firebaseapp.com', projectId: 'dashboard-washhub', appId: '1:698841097292:web:6f362dc4e4dbf5909d00e9' });
const auth = getAuth(app), db = getFirestore(app);
// FidelAI: solo lettura del saldo punti (stesso accesso della pagina FidelAI del gestionale)
const fApp = initializeApp({ apiKey: 'AIzaSyD7kHbNv09Mg-aYfFXSMKrVdi_JqlOuQF4', authDomain: 'fideliai-app.firebaseapp.com', projectId: 'fideliai-app', appId: '1:49232775542:web:e5e5771426462389c5d257' }, 'fidelai');
const fdb = getFirestore(fApp);
const MERCHANT = 'TSfZHShvSqOu4gPGA9JcV0IqmjI2';
const SEDE = new URLSearchParams(location.search).get('sede') || 'lungomare';
const DURATA = 60000;      // quanto resta il "grazie"
const VALIDO = 120000;     // un pagamento più vecchio di 2 minuti non si mostra (es. tablet riacceso)
const $ = id => document.getElementById(id);

let timer = null, ultimoTs = 0;

function riposo() {
  $('grazie').classList.remove('on');
  $('riposo').style.display = 'block';
  $('vid').play().catch(() => {});
}

async function mostra(p) {
  clearTimeout(timer);
  const tel = String(p.telefono || '').replace(/\D/g, '').replace(/^39(?=3\d{8,9}$)/, '');
  const nome = (String(p.nome || '').trim().split(/\s+/)[0] || '').toLowerCase().replace(/^./, c => c.toUpperCase());
  $('gNome').textContent = nome || '';
  $('gPunti').style.display = 'none';
  let haCard = false, saldo = 0;
  if (tel.length >= 9) {
    try {
      const c = await getDoc(doc(fdb, `merchants/${MERCHANT}/customers/${tel}`));
      if (c.exists() && c.data().cardAttivata === true) { haCard = true; saldo = c.data().totalPoints || 0; }
    } catch (e) { /* card non leggibile: si mostra comunque il QR */ }
  }
  const link = tel.length >= 9 ? `https://card.washhub.it/?c=${tel}` : 'https://card.washhub.it/';
  let ppe = 1;
  try { const m = await getDoc(doc(fdb, `merchants/${MERCHANT}`)); ppe = m.data()?.loyaltyConfig?.pointsPerEuro ?? 1; } catch (e) {}
  const pt = Math.round(Number(p.importo || 0) * ppe);
  if (haCard) {
    $('gSotto').textContent = 'Inquadra il QR per vedere la tua card e i premi che puoi già riscattare.';
    $('gPunti').textContent = pt > 0 ? `+${pt} punti in arrivo · saldo ${saldo}` : `Saldo ${saldo} punti`;
    $('gPunti').style.display = 'inline-flex';
    $('gQrLbl').textContent = 'La tua card';
  } else {
    $('gSotto').textContent = pt > 0
      ? `I ${pt} punti di oggi sono già tuoi: inquadra il QR e attiva la card fedeltà in 30 secondi.`
      : 'Inquadra il QR e attiva la tua card fedeltà: accumuli punti a ogni lavaggio.';
    $('gQrLbl').textContent = 'Attiva la card · 30 secondi';
  }
  const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
  $('qr').innerHTML = qr.createImgTag(10, 8);
  $('riposo').style.display = 'none';
  $('grazie').classList.add('on');
  const b = $('barra'); b.style.transition = 'none'; b.style.transform = 'scaleX(1)';
  requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = `transform ${DURATA}ms linear`; b.style.transform = 'scaleX(0)'; }));
  timer = setTimeout(riposo, DURATA);
}

function ascolta() {
  onSnapshot(doc(db, 'cassaDisplay', SEDE), snap => {
    $('stato').style.background = '#3ddc84';
    const p = snap.data(); if (!p) return;
    const ts = Number(p.ts) || 0;
    if (ts <= ultimoTs) return;
    const primo = ultimoTs === 0; ultimoTs = ts;
    if (p.azione === 'chiudi') { clearTimeout(timer); riposo(); return; }
    if (primo && Date.now() - ts > VALIDO) return;   // all'avvio non riprendere pagamenti vecchi
    if (Date.now() - ts > VALIDO) return;
    mostra(p);
  }, () => { $('stato').style.background = '#ff5a5a'; });
}

setPersistence(auth, browserLocalPersistence).catch(() => {});
onAuthStateChanged(auth, u => {
  if (u) { $('login').style.display = 'none'; riposo(); ascolta(); }
  else { $('login').style.display = 'flex'; }
});
$('fLogin').addEventListener('submit', async e => {
  e.preventDefault(); $('lErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('lEmail').value.trim(), $('lPwd').value); }
  catch (err) { $('lErr').textContent = 'Accesso non riuscito: controlla email e password.'; }
});
// Tocco sullo schermo durante il "grazie" = chiudi subito
$('grazie').addEventListener('click', () => { clearTimeout(timer); riposo(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && $('riposo').style.display !== 'none') $('vid').play().catch(() => {}); });
</script>
</body>
</html>
